[package]
name = "hydra"
version = "0.1.0"
edition = "2021"
description = "A research lab for testing Hydra Meshnet transport assumptions"
license = "GPL-3.0-only"
repository = "https://github.com/Georgecane/hydra"

[lib]
name = "hydra"
path = "src/lib.rs"

[[bin]]
name = "hydra-lab"
path = "src/main.rs"

[dependencies]
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = "0.3"

[dev-dependencies]
