[package]
name = "hydra"
version = "0.1.0"
edition = "2021"
description = "A research lab for testing Hydra Meshnet transport assumptions"
license = "GPL-3.0-only"
repository = "https://github.com/Georgecane/hydra"

[lib]
name = "hydra"
path = "src/lib.rs"

[[bin]]
name = "hydra-lab"
path = "src/main.rs"

[features]
default = []
bale-carrier = [
    "dep:async-trait",
    "dep:bale-signaling",
    "dep:lk-signaling",
    "dep:lktunnel",
    "dep:tokio",
]

[dependencies]
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = "0.3"
async-trait = { version = "0.1", optional = true }
bale-signaling = { git = "https://github.com/kookoo1sabzy/BaleVPN.git", rev = "c1594fa846251a4e48f8dfe11132f941ec0b24ea", package = "bale-signaling", optional = true }
lk-signaling = { git = "https://github.com/kookoo1sabzy/BaleVPN.git", rev = "c1594fa846251a4e48f8dfe11132f941ec0b24ea", package = "lk-signaling", optional = true }
lktunnel = { git = "https://github.com/kookoo1sabzy/BaleVPN.git", rev = "c1594fa846251a4e48f8dfe11132f941ec0b24ea", package = "lktunnel", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net"], optional = true }

[dev-dependencies]
